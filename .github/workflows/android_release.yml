name: Alap Android CI Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare Debug Keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Decoding debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from repository debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "WARNING: DEBUG_KEYSTORE_BASE64 secret not found; generating fallback debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Google Services Config
        env:
          GOOGLE_SERVICES_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_RAW" ]; then
            echo "Writing app/google-services.json from GOOGLE_SERVICES_JSON secret..."
            printf '%s' "$GOOGLE_SERVICES_RAW" > app/google-services.json
            python3 -m json.tool app/google-services.json >/dev/null
          elif [ -f app/google-services.json ]; then
            echo "Using existing app/google-services.json from repository."
          else
            echo "::error::app/google-services.json is missing! Add GOOGLE_SERVICES_JSON in GitHub Repository Secrets."
            exit 1
          fi

      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache

      - name: Prepare APK Asset
        id: meta
        run: |
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.1")
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.1"
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" ./alap-latest.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./alap-latest.apk --clobber
            gh release edit "$TAG" --title "Alap $TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" ./alap-latest.apk \
              --title "Alap $TAG" \
              --notes "Automated Android APK release for Alap $TAG" \
              --latest
          fi
